<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#BuildHybridAI 2026 - Hybrid Client Wrapper</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #161b22; padding: 24px; border-radius: 8px; border: 1px solid #30363d; }
        h2 { color: #58a6ff; margin-top: 0; }
        textarea { width: 100%; height: 100px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 12px; box-sizing: border-box; resize: vertical; }
        button { background: #238636; color: white; border: none; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2ea043; }
        .output { margin-top: 20px; background: #0d1117; padding: 12px; border-radius: 6px; border: 1px solid #30363d; min-height: 80px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛡️ Hybrid AI Client Wrapper</h2>
        <p>Powered by Firebase AI Logic & Gemini Nano</p>
        
        <label for="promptInput">Enter your prompt:</label>
        <textarea id="promptInput" placeholder="Type something here..."></textarea>
        <button id="sendBtn">Execute Hybrid Inference</button>

        <h3>Result & Telemetry:</h3>
        <div id="outputBox" class="output">Awaiting execution...</div>
    </div>

    <!-- Main Application Script -->
    <script type="module" src="./app.js"></script>
</body>
</html>
